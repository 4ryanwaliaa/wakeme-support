<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support – Wake Me App</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0f0f0f, #1a1a1a);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      padding: 40px;
      border-radius: 24px;
      width: 100%;
      max-width: 600px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      animation: fadeIn 0.8s ease-out;
    }

    .logo {
      font-size: 48px;
      margin-bottom: 10px;
    }

    h1 {
      color: #fdd835;
      font-size: 32px;
      margin-bottom: 10px;
    }

    p.subtitle {
      font-size: 18px;
      color: #aaa;
      margin-bottom: 30px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .btn {
      display: block;
      padding: 15px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      color: #fff;
      text-decoration: none;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .btn:hover {
      background: #fdd835;
      color: #000;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(253, 216, 53, 0.3);
    }

    .footer {
      margin-top: 40px;
      font-size: 14px;
      color: #666;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🕰️</div>
    <h1>Wake Me Support</h1>
    <p class="subtitle">How can we help you today?</p>
    
    <div class="links">
      <a href="privacy-policy.html" class="btn">Privacy Policy</a>
      <a href="delete-account.html" class="btn">Request Account Deletion</a>
      <a href="mailto:aryanwalia7888@gmail.com" class="btn">Contact Support</a>
    </div>

    <div class="footer">
      &copy; 2024 Wake Me App. All rights reserved.
    </div>
  </div>
</body>
</html>
